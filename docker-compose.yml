services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - PROMPTFOO_GRADER_MODEL=${PROMPTFOO_GRADER_MODEL:-}
      - PROMPTFOO_QUICK_TESTS=${PROMPTFOO_QUICK_TESTS:-10}
      - PROMPTFOO_DEEP_TESTS=${PROMPTFOO_DEEP_TESTS:-50}
      - PROMPTFOO_EMAIL=${PROMPTFOO_EMAIL:-}
      - PROMPTFOO_STRATEGIES=${PROMPTFOO_STRATEGIES:-}
    volumes:
      - ./results:/app/results
      - promptfoo-data:/root/.promptfoo
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      backend:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  promptfoo-data:
  ollama-data: